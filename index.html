<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f5f" />
    <title>Steadfast — Live with purpose</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Bump the ?v= version when shipping JS/CSS changes to bust caches.
         Use a fixed version string (not a random timestamp) so production can still cache. -->
    <link rel="stylesheet" href="/styles.css?v=1.0.0" />
    <script defer src="/app.js?v=1.0.0"></script>
  </body>
</html>
